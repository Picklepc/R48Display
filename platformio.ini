[env:waveshare_esp32_s3_touch_lcd_1_85]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
platform_packages =
  platformio/tool-esptoolpy@1.40801.0
board = waveshare_esp32_s3_touch_lcd_1_85
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
upload_speed = 460800

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DESP32QSPI_MAX_PIXELS_AT_ONCE=2048
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude

lib_deps =
  moononournation/GFX Library for Arduino@1.6.6
  bblanchon/ArduinoJson@^7.4.2
  h2zero/NimBLE-Arduino@^2.5.0
  lvgl/lvgl@8.4.0
  knolleary/PubSubClient@^2.8

; On-device-update variant: same firmware plus CONFIG_MBEDTLS_DYNAMIC_BUFFER so the
; TLS handshake for GitHub update checks frees its buffers when idle, and the
; fwUpdTask enabled via -DFWUPD_ONDEVICE. custom_sdkconfig triggers pioarduino's
; ESP-IDF hybrid rebuild, which rejects spaces in the project path — so this env is
; built in CI (space-free runner), NOT locally on this machine. See TASKS M5.0-05a.
[env:waveshare_esp32_s3_touch_lcd_1_85_updates]
extends = env:waveshare_esp32_s3_touch_lcd_1_85
build_flags =
  ${env:waveshare_esp32_s3_touch_lcd_1_85.build_flags}
  -DFWUPD_ONDEVICE=1
custom_sdkconfig =
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

; After the first USB flash, change upload_port to the displayed IP
; or mDNS host and run PlatformIO upload with this environment.
[env:waveshare_esp32_s3_touch_lcd_1_85_ota]
extends = env:waveshare_esp32_s3_touch_lcd_1_85
upload_protocol = espota
upload_port = 192.168.1.198
upload_flags =
  --auth=r48display

