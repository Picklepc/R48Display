name: Build Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e waveshare_esp32_s3_touch_lcd_1_85

      - name: Read firmware version
        id: version
        run: |
          VER=$(grep -oP '(?<=FIRMWARE_VERSION = ")[^"]+' include/BoardConfig.h)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create merged binary
        run: |
          BUILD=.pio/build/waveshare_esp32_s3_touch_lcd_1_85
          APP=$BUILD/firmware.bin
          FACTORY=$BUILD/firmware.factory.bin
          # arduino-esp32 3.x's bundled esptool pulls in deps the CI Python lacks
          # (rich_click), so reuse the factory image PlatformIO already assembles
          # (bootloader + partitions + boot_app0 + app at the partitions.csv
          # offsets). Fall back to a hand merge only if it isn't produced.
          # ESP32-S3 PlatformIO uploads map qio/qout to a DIO boot-image header;
          # merged web-installer images must match that or erased installs can
          # reset before the app starts.
          if [ -f "$FACTORY" ]; then
            cp "$FACTORY" firmware-merged.bin
          else
            pip install --quiet rich_click
            ESPTOOL=$(find ~/.platformio -name esptool.py | head -1)
            BOOT=$BUILD/bootloader.bin
            PARTS=$BUILD/partitions.bin
            BOOT_APP0=$(find ~/.platformio -name boot_app0.bin | head -1)
            partition_offset() {
              awk -F, -v name="$1" '
                /^[[:space:]]*#/ || /^[[:space:]]*$/ { next }
                {
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", $4)
                  if ($1 == name) { print $4; exit }
                }
              ' partitions.csv
            }
            OTADATA_OFFSET=$(partition_offset otadata)
            APP_OFFSET=$(partition_offset app0)
            test -n "$OTADATA_OFFSET"
            test -n "$APP_OFFSET"
            python "$ESPTOOL" --chip esp32s3 merge_bin \
              -o firmware-merged.bin \
              --flash_mode dio --flash_freq 80m --flash_size 16MB \
              0x0 "$BOOT" 0x8000 "$PARTS" "$OTADATA_OFFSET" "$BOOT_APP0" "$APP_OFFSET" "$APP"
          fi
          python - <<'PY'
          from pathlib import Path
          data = Path("firmware-merged.bin").read_bytes()
          mode = data[2] if len(data) > 2 else None
          if mode != 0x02:
              got = "missing" if mode is None else f"0x{mode:02x}"
              raise SystemExit(f"firmware-merged.bin bootloader flash mode header must be 0x02 (DIO); got {got}")
          PY
          sha256sum "$APP" firmware-merged.bin > checksums.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r48display-v${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            .pio/build/waveshare_esp32_s3_touch_lcd_1_85/firmware.bin
            firmware-merged.bin
            checksums.sha256
          if-no-files-found: error

      - name: Detect pre-release
        id: prerel
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A plain vX.Y.Z tag is a stable release; anything with an extra
          # suffix (v0.5.0a1, v0.5.0-rc1, …) publishes as a GitHub pre-release
          # so it lists in the installer but never becomes the public "latest".
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "R48Display ${{ github.ref_name }}"
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ steps.prerel.outputs.value }}
          files: |
            .pio/build/waveshare_esp32_s3_touch_lcd_1_85/firmware.bin
            firmware-merged.bin
            checksums.sha256
