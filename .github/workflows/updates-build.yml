name: Build Updates Variant

# Validates the on-device-update firmware variant (custom_sdkconfig / dynamic
# mbedTLS buffers), which can't be built locally because the ESP-IDF hybrid build
# rejects the space in the developer's project path. CI runners have no spaces.
# Runs when this workflow or platformio.ini changes on the 0.5.x branch, or on
# manual dispatch.

on:
  # Manual only. Auto-build disabled: the custom_sdkconfig hybrid build currently
  # fails on CI too (a managed component needs an unprovided embedded cert,
  # `https_server.crt.S`). See TASKS M5.0-05a before re-enabling.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build _updates env (custom_sdkconfig dynamic mbedTLS)
        run: pio run -e waveshare_esp32_s3_touch_lcd_1_85_updates
