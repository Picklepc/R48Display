name: Deploy Web Installer

# Publishes the ESP Web Tools installer to GitHub Pages, always serving the
# latest published GitHub Release. The firmware image is downloaded from the
# release assets in CI and bundled into the site so the browser fetches it
# same-origin (no CORS).
#
# Runs after the "Build Firmware" workflow finishes a tag build (that workflow
# creates the release). A release: published trigger would NOT fire here because
# the release is created with the default GITHUB_TOKEN, and token-created events
# can't trigger other workflows — so we key off workflow_run instead. Also runs
# on installer-page edits and manual dispatch.

on:
  workflow_run:
    workflows: [ "Build Firmware" ]
    types: [ completed ]
  push:
    branches: [ main ]
    paths:
      - 'installer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For workflow_run, only deploy after a successful tag build (head_branch is
    # the tag, e.g. "v0.3.6"). push/dispatch always proceed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install esptool for installer image normalization
        run: python3 -m pip install --quiet esptool==4.8.1

      - name: Assemble installer from releases (v0.3.6+)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/bin
          cp installer/index.html _site/index.html
          # One call gives tags + prerelease flags. "Latest" for the default
          # install is the newest STABLE (non-prerelease) release, picked from
          # this same list. A separate /releases/latest call races the release
          # that just published — which is exactly when this deploy fires — and
          # can return empty, wrongly falling back to the just-cut alpha.
          RELJSON=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=12")
          TAGS=$(echo "$RELJSON" | jq -r '.[].tag_name')
          LATEST=$(echo "$RELJSON" | jq -r 'map(select(.prerelease==false)) | .[0].tag_name // empty')
          [ -n "$LATEST" ] || LATEST=$(echo "$TAGS" | head -1)
          LIST=""
          for TAG in $TAGS; do
            # installer offers v0.3.6 and newer only
            [ "$(printf '%s\n' "$TAG" v0.3.6 | sort -V | head -1)" = "v0.3.6" ] || continue
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'firmware-merged.bin' --output "_site/bin/${TAG}.bin" || continue
            python3 - "$TAG" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          tag = sys.argv[1]
          image = Path(f"_site/bin/{tag}.bin")
          data = image.read_bytes()
          if len(data) <= 0x10000 or data[0] != 0xE9 or data[0x8000:0x8002] != b"\xAA\x50" or data[0x10000] != 0xE9:
              raise SystemExit(f"{tag}: firmware-merged.bin does not look like an R48Display full-flash image")
          if data[2] == 0x02:
              raise SystemExit(0)

          with tempfile.TemporaryDirectory() as tmpdir:
              tmp = Path(tmpdir)
              (tmp / "bootloader.bin").write_bytes(data[0:0x8000])
              (tmp / "partitions.bin").write_bytes(data[0x8000:0x9000])
              (tmp / "boot_app0.bin").write_bytes(data[0xE000:0x10000])
              (tmp / "app.bin").write_bytes(data[0x10000:])
              fixed = tmp / "firmware-merged-dio.bin"
              subprocess.run([
                  sys.executable, "-m", "esptool", "--chip", "esp32s3", "merge_bin",
                  "-o", str(fixed),
                  "--flash_mode", "dio",
                  "--flash_freq", "80m",
                  "--flash_size", "16MB",
                  "0x0", str(tmp / "bootloader.bin"),
                  "0x8000", str(tmp / "partitions.bin"),
                  "0xe000", str(tmp / "boot_app0.bin"),
                  "0x10000", str(tmp / "app.bin"),
              ], check=True)
              fixed_data = fixed.read_bytes()
              if fixed_data[2] != 0x02:
                  raise SystemExit(f"{tag}: normalized image is not DIO")
              image.write_bytes(fixed_data)
              print(f"{tag}: normalized merged image boot header to DIO")
          PY
            VER=${TAG#v}
            cat > "_site/manifest-${TAG}.json" <<EOF
          {
            "name": "R48Display",
            "version": "${VER}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bin/${TAG}.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
            ENTRY="{\"tag\":\"${TAG}\",\"version\":\"${VER}\"},"
            # Keep the default (latest stable) first so the installer selects and
            # labels it "(latest)"; everything else follows in newest-first order.
            if [ "$TAG" = "$LATEST" ]; then LIST="${ENTRY}${LIST}"; else LIST="${LIST}${ENTRY}"; fi
          done
          echo "{\"versions\":[${LIST%,}]}" > _site/versions.json
          cp "_site/bin/${LATEST}.bin" _site/firmware.bin
          cp "_site/manifest-${LATEST}.json" _site/manifest.json
          echo "Assembled: $(cat _site/versions.json)"
          ls -la _site/bin

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
